# Copy the map into the permanent vault around the default 20-minute run too.
#
# A DROP-IN RATHER THAN AN EDIT: friday-explore.service is the frozen mode's
# unit and is deliberately left byte-for-byte as it was. This adds backup steps
# either side of it and changes nothing about how she drives. `-` prefix so a
# backup failure can neither stop the run nor fail it.
[Service]
ExecStartPre=-/home/harsh/friday/venv/bin/python /home/harsh/friday/scripts/map_vault.py backup --reason "before friday-explore (20 min default)"
ExecStopPost=-/home/harsh/friday/venv/bin/python /home/harsh/friday/scripts/map_vault.py backup --reason "after friday-explore (20 min default)"
