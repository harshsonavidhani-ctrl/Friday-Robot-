<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08090c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Friday">
<title>Friday · Live Logs</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/static/icon-192.png">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header>
  <span class="dot" id="dot"></span>
  <span class="brand">Friday<span class="sep">·</span><span class="sub">Live Logs</span></span>
  <span class="spacer"></span>
  <button class="hbtn" id="btn-clear">Clear</button>
</header>

<div class="wrap">
  <aside>
    <p class="camlabel">Up Cam</p>
    <div class="cambox" id="box-up"></div>

    <p class="camlabel">Down Cam</p>
    <div class="cambox" id="box-down"></div>

    <p class="section">Face Mood</p>
    <div class="moods" id="moods"></div>

    <details class="calib">
      <summary>Calibration</summary>
      <div class="calib-body">
        <div class="calrow">
          <label for="move_speed">Default move speed</label>
          <input type="number" id="move_speed" min="0" max="255" step="1">
          <button data-save="move_speed">Save</button>
        </div>
        <div class="calrow">
          <label for="turn_speed">Default turn speed</label>
          <input type="number" id="turn_speed" min="0" max="255" step="1">
          <button data-save="turn_speed">Save</button>
        </div>
        <div class="calrow">
          <label for="forward_cm_per_s">Forward calibration (cm/s)</label>
          <input type="number" id="forward_cm_per_s" min="0" step="0.1">
          <button data-save="forward_cm_per_s">Save</button>
        </div>
        <div class="calrow">
          <label for="turn_deg_per_s">Turn calibration (deg/s)</label>
          <input type="number" id="turn_deg_per_s" min="0" step="0.1">
          <button data-save="turn_deg_per_s">Save</button>
        </div>
        <p class="calnote" id="calnote">Saved to state/calibration.json — motor
          code reads it per command, so no restart is needed.</p>
      </div>
    </details>
  </aside>

  <main>
    <div class="filters" id="filters"></div>
    <div class="log" id="log">
      <p class="empty">Waiting for Friday…</p>
    </div>
  </main>
</div>

<script src="/static/app.js"></script>
</body>
</html>
